<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Elance — Feed</title><link rel="stylesheet" href="style.css"/></head><body>
<div class="layout">
  
<div class="side-left">
  <div class="brand"><img src="assets/logo_enlace_5000px.png" alt="Elance"></div>
  <a class="nav-item active" href="feed.html" title="Feed"><img src="assets/ic-home.svg" alt="Home"/></a>
  <a class="nav-item" href="profile.html" title="Perfil"><img src="assets/ic-profile.svg" alt="Perfil"/></a>
  <a class="nav-item" href="connections.html" title="Conexões"><img src="assets/ic-connections.svg" alt="Conexões"/></a>
  <a class="nav-item" href="chat.html" title="Mensagens"><img src="assets/ic-chat.svg" alt="Mensagens"/></a>
  <a class="nav-item" href="notifications.html" title="Notificações"><img src="assets/ic-bell.svg" alt="Notificações"/></a>
  <a class="nav-item" href="settings.html" title="Configurações"><img src="assets/ic-gear.svg" alt="Config"/></a>
<a class="nav-item" href="#" title="Sair" onclick="logout()"><img src="assets/ic-logout.svg" alt="Sair"/></a>
</div>

  <main>
    <div class="container">
      <div class="card"><div class="hd">Feed</div><div class="bd">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <select id="fInstrument" class="input" onchange="renderFeed()"><option value="">Instrumento</option><option>Voz</option><option>Guitarra</option><option>Violão</option><option>Baixo</option><option>Bateria</option><option>Teclado</option><option>DJ</option></select>
          <select id="fGenre" class="input" onchange="renderFeed()"><option value="">Gênero</option><option>Pop</option><option>Rock</option><option>Sertanejo</option><option>Trap</option><option>Gospel</option><option>Jazz</option></select>
        </div>
      </div></div>
      <div class="card"><div class="hd">Publicações</div><div id="feed" class="bd"></div></div>
    </div>
  </main>
  <aside class="side-right">
    <div class="container">
      <div class="card widget"><div class="bd">
        <div class="title">Quem seguir</div>
        <div id="suggestRight" class="listy"></div>
      </div></div>
      <div class="card widget"><div class="bd">
        <div class="title">Tendências musicais</div>
        <div id="trending" class="listy"></div>
      </div></div>
      <div class="card widget"><div class="bd">
        <div class="title">Atividade recente</div>
        <div id="activity" class="listy"></div>
      </div></div>
    </div>
  </aside>
</div>
<a class="btn brand fab" href="nova-publicacao.html" title="Nova publicação"><img src="assets/ic-plus.svg" alt="+"/></a>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
<script>ensureAuth();renderFeed();renderWidgetsRight();</script>
</body></html>
