<main><div class="container" style="max-width:980px"><div class="card"><div class="bd profile-hero"><div id="heroAvatar" class="avatar" style="width:92px;height:92px;font-size:22px">EU</div><div style="flex:1"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div id="profName" style="font-weight:800;font-size:18px">Seu nome</div><div id="profHandle" class="muted small">@handle</div></div><button id="btnEditToggle" class="btn brand" onclick="toggleEdit()">Editar perfil</button></div><div id="profBio" class="small" style="margin-top:6px"></div><div class="counts" style="margin-top:6px"><div><strong id="countPosts">0</strong> publicações</div><div><strong id="countCon">0</strong> conexões</div></div></div></div><div class="bd hidden" id="editForm"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Nome</label><input id="p_name" class="input"></div><div><label>Avatar (URL)</label><input id="p_avatar" class="input" placeholder="https://..."></div></div><label>Bio</label><textarea id="p_bio"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Instrumentos</label><input id="p_instruments" class="input" placeholder="Voz, Violão"></div><div><label>Gêneros</label><input id="p_genres" class="input" placeholder="Pop, Sertanejo"></div></div><div style="margin-top:10px"><button class="btn brand" onclick="saveProfile()">Salvar</button> <button class="btn ghost" onclick="toggleEdit()">Cancelar</button></div></div><div class="bd"><div class="tabs"><div id="tabPosts" class="tab active" onclick="switchTab('posts')">Publicações</div><div id="tabPort" class="tab" onclick="switchTab('portfolio')">Meu portfólio</div></div><div id="panePosts" class="bd"><div id="myPosts"></div></div><div id="panePortfolio" class="bd hidden"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Tipo</label><select id="pf_type" class="input"><option value="image">Imagem</option><option value="video">Vídeo</option><option value="link">Link</option></select></div><div><label>Título</label><input id="pf_title" class="input"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>URL (vídeo/link)</label><input id="pf_url" class="input" placeholder="https://..."></div><div><label>Imagem (arquivo)</label><input id="pf_file" type="file" accept="image/*"></div></div><div style="margin-top:10px"><button class="btn brand" onclick="addPortfolio()">Adicionar</button></div><hr><div id="portfolioGrid" class="grid-portfolio"></div></div></div></div></div></main></div><div id="toast" class="toast hidden"></div><script src="app.js"></script><script>ensureAuth && ensureAuth(); loadProfile && loadProfile(); renderMyPosts && renderMyPosts(); renderPortfolio && renderPortfolio();</script></body></html>
