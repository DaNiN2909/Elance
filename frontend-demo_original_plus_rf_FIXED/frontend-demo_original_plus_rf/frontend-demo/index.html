<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>Login e Cadastrar</title>
	<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css'>
	<link rel="stylesheet" href="login.css">
</head>

<body>

	<div class="container" id="container">
		<div class="form-container sign-up-container">
			<form id="signUpForm" action="outra-pagina.html">
				<h1>Cadastrar</h1>
				<div class="signup-fields">
					<input type="text" id="firstName" placeholder="Nome" required />
					<input type="email" id="email" placeholder="E-mail" required />
					<input type="text" id="cpf" placeholder="CPF" required />
					<input type="tel" id="phone" placeholder="Telefone" required />
					<input type="password" id="password" placeholder="Senha" required />
				</div>
				<button type="button" id="submitSignUp">Cadastrar</button>
			</form>
		</div>
		<div class="form-container sign-in-container">
			<form id="loginForm">
				<h1>Entrar</h1>
				<div class="social-container">
					<a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
					<a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
					<a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
				</div>
				<span>ou use sua conta</span>
				<input type="email" id="loginEmail" placeholder="E-mail" required />
				<input type="password" id="loginPassword" placeholder="Senha" required />
				<a href="#">Esqueceu sua senha?</a>
				<button type="button" id="submitLogin">Entrar</button>
			</form>
		</div>
		<div class="overlay-container">
			<div class="overlay">
				<div class="overlay-panel overlay-left">
					<h1>Bem-vindo de Volta!</h1>
					<p>Para continuar conectado conosco, faça login com suas informações pessoais</p>
					<button class="ghost" id="signIn">Entrar</button>
				</div>
				<div class="overlay-panel overlay-right">
					<h1>Olá, Bem-vindo!</h1>
					<p>Insira seus dados pessoais e comece sua jornada conosco</p>
					<button class="ghost" id="signUp">Cadastrar</button>
				</div>
			</div>
		</div>
	</div>

	<footer>
		<p>

		</p>
	</footer>

	<script src="login.js"></script>

</body>

</html>
