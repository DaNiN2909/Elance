<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Elance</title><link rel="stylesheet" href="style.css"/></head><body><div class="layout"><div class="side-left"><div class="brand"><a href="feed.html"><img src="assets/logo_enlace_5000px.png"></a></div></div><main><div class="container" style="max-width:760px"><div class="card"><div class="hd">Nova publicação</div><div class="bd"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Tipo</label><select id="ctype" class="input"><option>Cover</option><option>Autoral</option><option>Jam</option><option>Aula</option><option>Gear Review</option></select></div><div><label>Instrumento</label><select id="instrument" class="input"><option>Voz</option><option>Guitarra</option><option>Violão</option><option>Baixo</option><option>Bateria</option><option>Teclado</option><option>DJ</option></select></div></div><label>Gênero</label><select id="genre" class="input"><option>Pop</option><option>Rock</option><option>Sertanejo</option><option>Trap</option><option>Gospel</option><option>Jazz</option></select><label>Legenda</label><textarea id="caption"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Imagem (até 2MB)</label><input id="image" type="file" accept="image/*"></div><div><label>Vídeo (URL)</label><input id="video" class="input" placeholder="https://..."></div></div><div style="margin-top:10px"><button class="btn brand" onclick="publish()">Publicar</button> <a class="btn ghost" href="feed.html">Cancelar</a></div></div></div></div></main></div><div id="toast" class="toast hidden"></div><script src="app.js"></script><script>ensureAuth && ensureAuth();</script></body></html>
