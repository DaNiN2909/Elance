<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css"></head>
<body>

<header>
  <div class="title"><a href="index.html">Elance RF Layer</a></div>
  <nav class="row small" style="gap:10px">
    <a href="login.html">Login</a>
    <a href="register.html">Cadastro</a>
    <a href="feed.html">Feed</a>
    <a href="profile.html">Perfil</a>
    <a href="connections.html">Conexões</a>
    <a href="chat.html">Mensagens</a>
    <a href="notifications.html">Moderação</a>
  </nav>
</header>


<main class="grid">
  <section>
    <div class="card"><h2>Conversas</h2><div id="threads"></div></div>
    <div class="card"><h3>Solicitações de mensagem (RF010)</h3><div id="msgRequests"></div></div>
  </section>
  <aside>
    <div class="card">
      <h3>Novo chat</h3>
      <label>ID do usuário</label><input id="chatWithId" placeholder="ex.: 1734567890">
      <label>Mensagem</label><input id="msgInput">
      <div style="margin-top:8px"><button class="btn" onclick="sendMsg(Number(document.getElementById('chatWithId').value))">Enviar</button></div>
    </div>
  </aside>
</main>
<script>document.addEventListener('DOMContentLoaded',()=>{ensureAuth();renderThreads();renderMsgRequests();});</script>

<script src="app.js"></script>
<script src="login.js"></script>
</body>
</html>
